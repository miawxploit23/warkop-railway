<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Warkop Posisi – Kritik &amp; Saran</title>
<style>
:root{--bg:#0d0907;--card:#1a110d;--line:#3a2519;--red:#d62828;--red2:#ff4d4d;--brown:#8b5a3c;--cream:#f3e6d8;--mute:#b79b86;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 50% -10%,#3a1410 0,var(--bg) 60%) var(--bg);color:var(--cream);font-family:Georgia,'Times New Roman',serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:28px 18px 48px}
header{text-align:center;margin-bottom:24px}
.pin{width:64px;height:64px;filter:drop-shadow(0 6px 14px rgba(214,40,40,.45))}
h1{margin:10px 0 2px;font-size:30px}
h1 span{color:var(--red2)}
.sub{color:var(--mute);font-style:italic;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--red);border-radius:14px;padding:20px}
label{display:block;margin-bottom:8px;font-weight:bold}
textarea{width:100%;min-height:150px;resize:vertical;background:#0d0907;color:var(--cream);border:1px solid var(--brown);border-radius:10px;padding:12px;font:inherit;font-size:16px}
textarea:focus{outline:2px solid var(--red)}
.row{display:flex;justify-content:space-between;margin-top:8px;color:var(--mute);font-size:13px}
button{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;width:100%;background:linear-gradient(180deg,var(--red),#9d1c1c);color:#fff;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:bold;font-size:16px;cursor:pointer}
button:disabled{opacity:.5}
button svg{width:18px;height:18px}
.msg{margin-top:14px;text-align:center;color:var(--mute)}
.ok{color:#9be28f}.err{color:var(--red2)}
.hp{position:absolute;left:-9999px}
</style>
</head>
<body>
<div class="wrap">
<header>
<svg class="pin" viewBox="0 0 24 24" aria-hidden="true"><path fill="#d62828" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7z"/><circle cx="12" cy="9" r="3" fill="#0d0907"/></svg>
<h1>Warkop <span>Posisi</span></h1>
<p class="sub">Ngopi dulu, cerita kemudian. Kritik &amp; saranmu sangat berarti.</p>
</header>
<section class="card">
<label for="t">Kritik atau saran untuk Warkop Posisi</label>
<textarea id="t" maxlength="1000" placeholder="Tulis di sini… (anonim, tanpa nama)"></textarea>
<input id="hp" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
<div class="row"><span>Dikirim secara anonim</span><span id="cnt">0/1000</span></div>
<button id="send"><svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>Kirim Masukan</button>
<div id="status" class="msg"></div>
</section>
</div>
<script>

const $ = id => document.getElementById(id);
$('t').addEventListener('input', () => $('cnt').textContent = $('t').value.length + '/1000');
function st(txt, cls){ $('status').textContent = txt; $('status').className = 'msg ' + (cls||''); }

$('send').addEventListener('click', async () => {
  const text = $('t').value.trim();
  if (!text) return st('Tulis dulu masukanmu ya.', 'err');
  if ($('hp').value) return;
  $('send').disabled = true;
  try {
    const r = await fetch('/api/feedback', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text})
    });
    if (!r.ok) throw new Error(r.status);
    $('t').value = ''; $('cnt').textContent = '0/1000';
    st('Terima kasih! Masukanmu sudah terkirim.', 'ok');
  } catch (e) {
    st('Gagal mengirim. Coba lagi sebentar.', 'err');
  }
  $('send').disabled = false;
});
</script>
</body>
</html>
